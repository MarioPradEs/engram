name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.10"

      - name: Run unit tests
        run: go test ./...

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.10"

      - name: Run e2e tests
        run: go test -tags e2e ./internal/server/...

  race-tests:
    name: Race Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.10"

      # The race detector requires cgo (fails with "-race requires cgo" when
      # CGO_ENABLED=0). ubuntu-latest ships gcc; modernc.org/sqlite is pure Go,
      # so enabling cgo does not change the sqlite driver.
      #
      # Scoped to concurrency-sensitive packages instead of the full tree:
      # `go test -race ./...` would be red from pre-existing failures in
      # cmd/engram and internal/cloud/dashboard, giving no race signal. This job
      # guards the self-service enrollment mutex (enrollMu / TestSelfEnroll_Concurrent).
      # Add packages here as they gain concurrent code.
      - name: Run race detector (concurrency-sensitive packages)
        env:
          CGO_ENABLED: "1"
        run: go test -race ./internal/cloud/cloudserver/...
